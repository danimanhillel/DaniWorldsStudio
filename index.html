<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>DaniWorldsStudio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#121212;color:#e0e0e0;height:100vh;overflow:hidden;display:flex;flex-direction:column}header{background:#1e1e1e;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}.main{flex:1;display:flex;flex-direction:column}.top-area{display:flex;height:45%}.media-panel{width:28%;background:#1a1a1a;padding:12px;overflow:auto}#mediaList{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.media-item{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;cursor:grab;background:#252525}.media-item img{width:100%;height:100%;object-fit:cover}.media-type{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);text-align:center;font-size:11px;padding:3px}.preview-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a}#previewCanvas{background:#000;border:1px solid #333;max-width:90%;max-height:65%}.controls{margin-top:10px;display:flex;gap:10px;align-items:center}.timeline-area{flex:1;background:#161616}.timeline{overflow:auto;position:relative;direction:ltr}.track{height:56px;background:#1a1a1a;border:1px solid #333;position:relative}.clip{position:absolute;height:48px;top:4px;background:#4fc3f7;border-radius:4px;background-size:cover}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ff5252}
</style>
</head>
<body>
<header><h1 style="color:#4fc3f7">DaniWorldsStudio</h1><button id="exportBtn" style="background:#2196f3;color:#fff;border:none;padding:8px 16px;border-radius:6px">Export</button></header>
<div class="main">
  <div class="top-area">
    <div class="media-panel">
      <button id="importBtn" style="width:100%;padding:10px;background:#333;color:#fff;border:2px dashed #555;border-radius:8px;margin-bottom:12px">Import</button>
      <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple style="display:none">
      <div id="mediaList"></div>
    </div>
    <div class="preview-panel">
      <div class="aspect-controls" style="display:flex;gap:6px;margin-bottom:8px">
        <button class="aspect-btn active" data-aspect="16:9">16:9</button>
        <button class="aspect-btn" data-aspect="9:16">9:16</button>
        <button class="aspect-btn" data-aspect="1:1">1:1</button>
      </div>
      <canvas id="previewCanvas" width="1280" height="720"></canvas>
      <div class="controls">
        <button id="playBtn">Play</button>
        <button id="stopBtn">Stop</button>
        <span id="timeDisplay">00:00</span>
        <input type="range" id="scrubber" min="0" max="100" value="0" style="flex:1">
      </div>
    </div>
  </div>
  <div class="timeline-area">
    <div class="toolbar" style="padding:8px;background:#1e1e1e">
      <button class="tool-btn active" data-tool="select">Select</button>
      <button class="tool-btn" data-tool="volume">Volume</button>
    </div>
    <div class="timeline" id="timeline">
      <div class="tracks">
        <div class="track" data-track="v0"></div>
        <div class="track" data-track="v1"></div>
        <div class="track audio" data-track="a0"></div>
      </div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>
</div>
<script>
let media=[], videoTracks=[[],[]], audioTracks=[[]], currentTime=0, duration=30, isPlaying=false, pixelsPerSecond=60, selectedClips=[], canvas=document.getElementById('previewCanvas'), ctx=canvas.getContext('2d'), audioContext=null, gainNodes=new Map(), activeTool='select';

function ensureAudio(m){if(!audioContext) audioContext=new AudioContext(); if(!gainNodes.has(m.id)&&m.element){try{const s=audioContext.createMediaElementSource(m.element); const g=audioContext.createGain(); s.connect(g); g.connect(audioContext.destination); gainNodes.set(m.id,g);}catch(e){}}}
function getVolume(clip,local){if(!clip.volumePoints) return 1; return clip.volumePoints[0]?.v||1;}

document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=async e=>{
  for(const file of e.target.files){
    const url=URL.createObjectURL(file);
    const type=file.type.startsWith('video')?'video':file.type.startsWith('audio')?'audio':'image';
    let item={name:file.name,type,url,duration:5,thumb:null,element:null};
    if(type==='video'){
      const v=document.createElement('video'); v.src=url; v.playsInline=true;
      await new Promise(r=>v.onloadedmetadata=r);
      item.duration=v.duration||5; item.element=v;
      v.currentTime=1; await new Promise(r=>{v.onseeked=r;setTimeout(r,300)});
      const tc=document.createElement('canvas'); tc.width=160; tc.height=90;
      tc.getContext('2d').drawImage(v,0,0,160,90); item.thumb=tc.toDataURL();
      ensureAudio(item);
    } else if(type==='audio'){
      const a=document.createElement('audio'); a.src=url;
      await new Promise(r=>a.onloadedmetadata=r);
      item.duration=a.duration||5; item.element=a;
      item.thumb='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90"><rect fill="%23222" width="160" height="90"/><text x="80" y="50" fill="%23aaa" font-size="12" text-anchor="middle">AUDIO</text></svg>';
      ensureAudio(item);
    } else {
      const img=new Image(); img.src=url; await new Promise(r=>img.onload=r);
      item.element=img; item.thumb=url;
    }
    media.push(item);
  }
  renderMedia();
  e.target.value='';
};

function renderMedia(){
  const list=document.getElementById('mediaList');
  list.innerHTML='';
  media.forEach(m=>{
    const el=document.createElement('div');
    el.className='media-item'; el.draggable=true;
    const label=m.type==='video'?'ווידאו':m.type==='audio'?'אודיו':'תמונה';
    el.innerHTML=`<img src="${m.thumb||''}"><div class="media-type">${label}</div>`;
    el.ondragstart=ev=>ev.dataTransfer.setData('mediaId',media.indexOf(m));
    list.appendChild(el);
  });
}

document.querySelectorAll('.track').forEach(track=>{
  track.ondragover=e=>e.preventDefault();
  track.ondrop=e=>{
    const idx=e.dataTransfer.getData('mediaId');
    const m=media[idx]; if(!m) return;
    const start=Math.max(0,(e.clientX-track.getBoundingClientRect().left)/pixelsPerSecond);
    const clip={mediaId:idx,startTime:start,duration:m.duration,volumePoints:[{t:0,v:1}]};
    const key=track.dataset.track;
    if(key.startsWith('v')) videoTracks[parseInt(key[1])].push(clip);
    else audioTracks[0].push(clip);
    updateDuration(); renderTimeline();
  };
});

function updateDuration(){
  let max=10;
  [...videoTracks,...audioTracks].forEach(t=>t.forEach(c=>max=Math.max(max,c.startTime+c.duration)));
  duration=max; document.getElementById('scrubber').max=duration;
}

function renderTimeline(){
  document.querySelectorAll('.track').forEach(track=>{
    const key=track.dataset.track;
    const arr=key.startsWith('v')?videoTracks[parseInt(key[1])]:audioTracks[0];
    track.innerHTML='';
    arr.forEach(clip=>{
      const m=media[clip.mediaId];
      const el=document.createElement('div');
      el.className='clip';
      el.style.left=(clip.startTime*pixelsPerSecond)+'px';
      el.style.width=Math.max(20,clip.duration*pixelsPerSecond)+'px';
      if(m&&m.thumb) el.style.backgroundImage=`url(${m.thumb})`;
      track.appendChild(el);
    });
  });
  document.getElementById('playhead').style.left=(currentTime*pixelsPerSecond)+'px';
}

async function syncMedia(force=false){
  const active=new Set();
  const toPlay=[];
  [...videoTracks,...audioTracks].forEach(tr=>{
    tr.forEach(clip=>{
      if(currentTime>=clip.startTime && currentTime<clip.startTime+clip.duration){
        active.add(clip.mediaId);
        const m=media[clip.mediaId];
        if(!m||!m.element) return;
        const local=currentTime-clip.startTime;
        const el=m.element;
        if(Math.abs(el.currentTime-local)>0.2) el.currentTime=local;
        ensureAudio(m);
        const g=gainNodes.get(m.id||clip.mediaId);
        if(g) g.gain.value=getVolume(clip,local);
        if(force||isPlaying) toPlay.push(el);
      }
    });
  });
  media.forEach((m,i)=>{if(m.element&&!active.has(i)) m.element.pause();});
  if(force) await Promise.all(toPlay.map(el=>el.play().catch(()=>{})));
}

document.getElementById('playBtn').onclick=async()=>{
  isPlaying=true;
  await syncMedia(true);
  let last=performance.now();
  function loop(ts){
    if(!isPlaying) return;
    currentTime+=(ts-last)/1000; last=ts;
    if(currentTime>duration) isPlaying=false;
    document.getElementById('timeDisplay').textContent=currentTime.toFixed(2);
    document.getElementById('playhead').style.left=(currentTime*pixelsPerSecond)+'px';
    syncMedia();
    renderFrame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
};
document.getElementById('stopBtn').onclick=()=>{isPlaying=false; currentTime=0; media.forEach(m=>m.element&&m.element.pause()); renderFrame();};

function renderFrame(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let t=0;t<2;t++){
    for(let clip of videoTracks[t]){
      if(currentTime>=clip.startTime && currentTime<clip.startTime+clip.duration){
        const m=media[clip.mediaId];
        if(m&&m.element) ctx.drawImage(m.element,0,0,canvas.width,canvas.height);
      }
    }
  }
}
updateDuration(); renderTimeline(); renderFrame();
</script>
</body>
</html>
