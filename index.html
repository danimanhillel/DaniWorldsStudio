<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DaniWorldsStudio - Video Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e1e1e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 20px; color: #4fc3f7; }
    .export-btn {
      background: #2196f3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .export-btn:hover { background: #1976d2; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top { display: flex; height: 42%; border-bottom: 1px solid #333; }
    .media-panel {
      width: 32%;
      background: #1a1a1a;
      padding: 16px;
      overflow-y: auto;
      border-left: 1px solid #333;
    }
    .import-btn {
      width: 100%;
      padding: 12px;
      background: #333;
      color: white;
      border: 2px dashed #555;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .import-btn:hover { background: #444; }
    .media-item {
      background: #252525;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .media-item:active { cursor: grabbing; }
    .thumb {
      width: 80px;
      height: 45px;
      background: #000;
      object-fit: cover;
      border-radius: 4px;
    }
    .media-info { flex: 1; font-size: 13px; }
    .preview-panel {
      flex: 1;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #previewCanvas {
      max-width: 100%;
      max-height: 68%;
      background: #000;
      border: 1px solid #333;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      width: 100%;
      max-width: 600px;
    }
    .controls button {
      background: #333;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .controls button:hover { background: #444; }
    #timeDisplay { font-family: monospace; min-width: 80px; }
    #scrubber { flex: 1; accent-color: #4fc3f7; }
    .timeline-area { flex: 1; background: #161616; display: flex; flex-direction: column; }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    .tool-btn {
      padding: 6px 12px;
      background: #333;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #2196f3;
      color: white;
      border-color: #2196f3;
    }
    .timeline {
      flex: 1;
      overflow: auto;
      position: relative;
      padding: 8px 10px;
    }
    .time-ruler {
      height: 28px;
      background: #222;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #333;
      font-size: 11px;
      color: #888;
    }
    .track-label {
      position: absolute;
      left: 4px;
      top: 2px;
      font-size: 10px;
      color: #666;
      pointer-events: none;
    }
    .tracks { display: flex; flex-direction: column; gap: 3px; }
    .track {
      height: 56px;
      background: #1a1a1a;
      border: 1px solid #333;
      position: relative;
      border-radius: 4px;
    }
    .track.audio { background: #1a1f1a; border-color: #2a3a2a; }
    .clip {
      position: absolute;
      height: 48px;
      top: 4px;
      background: #4fc3f7;
      border-radius: 4px;
      overflow: hidden;
      cursor: move;
      display: flex;
      align-items: center;
      padding: 0 6px;
      font-size: 11px;
      color: white;
      white-space: nowrap;
      background-size: cover;
      background-position: center;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
    }
    .clip.selected { outline: 2px solid #ffeb3b; z-index: 5; }
    .clip.audio-clip { background: #4caf50; }
    .clip-info {
      background: rgba(0,0,0,0.55);
      padding: 2px 6px;
      border-radius: 3px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff5252;
      z-index: 20;
      pointer-events: none;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 8px;
      min-width: 340px;
    }
    .modal-content label { display: block; margin: 10px 0 4px; font-size: 13px; }
    .modal-content select, .modal-content button {
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
      background: #333;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
    }
    .status { font-size: 12px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>DaniWorldsStudio</h1>
    <button class="export-btn" id="exportBtn">Export</button>
  </header>

  <div class="main">
    <div class="top">
      <div class="media-panel">
        <button class="import-btn" id="importBtn">Import מדיה / אודיו</button>
        <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple style="display:none">
        <div id="mediaList"></div>
      </div>
      <div class="preview-panel">
        <canvas id="previewCanvas" width="1280" height="720"></canvas>
        <div class="controls">
          <button id="playBtn">Play</button>
          <button id="stopBtn">Stop</button>
          <span id="timeDisplay">00:00.00</span>
          <input type="range" id="scrubber" min="0" max="100" value="0" step="0.01">
        </div>
        <div class="status" id="status">מוכן</div>
      </div>
    </div>

    <div class="timeline-area">
      <div class="toolbar">
        <button class="tool-btn active" data-tool="select">בחירה (Select)</button>
        <button class="tool-btn" data-tool="trim">קיצור (Trim)</button>
        <button class="tool-btn" data-tool="split">חיתוך (Split)</button>
        <span style="margin-right:auto; font-size:12px; color:#888;">בחר קליפ + Delete/Backspace למחיקה</span>
      </div>
      <div class="timeline" id="timeline">
        <div class="time-ruler" id="timeRuler"></div>
        <div class="tracks" id="tracksContainer">
          <div class="track" data-track="v0" data-type="video"><span class="track-label">V1</span></div>
          <div class="track" data-track="v1" data-type="video"><span class="track-label">V2</span></div>
          <div class="track" data-track="v2" data-type="video"><span class="track-label">V3</span></div>
          <div class="track audio" data-track="a0" data-type="audio"><span class="track-label">A1</span></div>
          <div class="track audio" data-track="a1" data-type="audio"><span class="track-label">A2</span></div>
          <div class="track audio" data-track="a2" data-type="audio"><span class="track-label">A3</span></div>
        </div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="exportModal">
    <div class="modal-content">
      <h3>הגדרות ייצוא</h3>
      <label>יחס גובה-רוחב:</label>
      <select id="aspectSelect">
        <option value="16:9" selected>16:9 (רחב)</option>
        <option value="9:16">9:16 (אנכי / Stories)</option>
        <option value="1:1">1:1 (ריבוע)</option>
        <option value="4:3">4:3 (קלאסי)</option>
      </select>
      <label>רזולוציה:</label>
      <select id="resSelect">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">2K (1440p)</option>
        <option value="2160">4K (2160p)</option>
      </select>
      <label>FPS:</label>
      <select id="fpsSelect">
        <option value="24">24</option>
        <option value="30" selected>30</option>
        <option value="50">50</option>
        <option value="60">60</option>
      </select>
      <label>פורמט / דחיסה:</label>
      <select id="formatSelect">
        <option value="webm-vp9" selected>WebM (VP9) - מומלץ, איכות גבוהה</option>
        <option value="webm-vp8">WebM (VP8) - תאימות רחבה</option>
        <option value="webm-av1">WebM (AV1) - דחיסה מעולה (איטי יותר)</option>
      </select>
      <button id="startExport">ייצא סרטון</button>
      <button id="closeModal">סגור</button>
      <div id="exportStatus"></div>
    </div>
  </div>

  <script>
    let media = [];
    let videoTracks = [[], [], []];
    let audioTracks = [[], [], []];
    let currentTime = 0;
    let duration = 30;
    let isPlaying = false;
    let activeTool = 'select';
    let pixelsPerSecond = 60;
    let selectedClip = null;
    let playheadEl = document.getElementById('playhead');
    let canvas = document.getElementById('previewCanvas');
    let ctx = canvas.getContext('2d');
    let animationId = null;
    let lastTimestamp = 0;
    let audioContext = null;

    function getTrackArray(trackKey) {
      if (trackKey.startsWith('v')) return videoTracks[parseInt(trackKey.slice(1))];
      return audioTracks[parseInt(trackKey.slice(1))];
    }

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTool = btn.dataset.tool;
        renderTimeline();
      };
    });

    document.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedClip) {
        e.preventDefault();
        const arr = getTrackArray(selectedClip.trackKey);
        const idx = arr.findIndex(c => c.id === selectedClip.id);
        if (idx >= 0) arr.splice(idx, 1);
        selectedClip = null;
        updateDuration();
        renderTimeline();
        renderFrame();
      }
    });

    document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = async (e) => {
      for (let file of e.target.files) {
        const url = URL.createObjectURL(file);
        const id = Date.now() + Math.random();
        let type = 'image';
        if (file.type.startsWith('video')) type = 'video';
        else if (file.type.startsWith('audio')) type = 'audio';

        let item = { id, name: file.name, type, url, duration: 5, thumb: null, element: null };

        if (type === 'video') {
          const video = document.createElement('video');
          video.src = url;
          video.preload = 'auto';
          video.muted = false;
          video.playsInline = true;
          await new Promise(r => { video.onloadedmetadata = r; video.onerror = r; });
          item.duration = video.duration || 5;
          item.element = video;
          video.currentTime = Math.min(1, item.duration * 0.3);
          await new Promise(r => { video.onseeked = r; setTimeout(r, 500); });
          const tc = document.createElement('canvas');
          tc.width = 160; tc.height = 90;
          tc.getContext('2d').drawImage(video, 0, 0, 160, 90);
          item.thumb = tc.toDataURL();
        } else if (type === 'audio') {
          const audio = document.createElement('audio');
          audio.src = url;
          audio.preload = 'metadata';
          await new Promise(r => { audio.onloadedmetadata = r; audio.onerror = r; });
          item.duration = audio.duration || 5;
          item.element = audio;
          item.thumb = null;
        } else {
          const img = new Image();
          img.src = url;
          await new Promise(r => img.onload = r);
          item.element = img;
          item.thumb = url;
          item.duration = 5;
        }
        media.push(item);
      }
      renderMediaList();
      e.target.value = '';
    };

    function renderMediaList() {
      const list = document.getElementById('mediaList');
      list.innerHTML = '';
      media.forEach(m => {
        const el = document.createElement('div');
        el.className = 'media-item';
        el.draggable = true;
        const thumbSrc = m.thumb || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="45"><rect fill="%23333" width="80" height="45"/><text x="40" y="25" fill="%23aaa" font-size="10" text-anchor="middle">AUDIO</text></svg>';
        el.innerHTML = `<img class="thumb" src="${thumbSrc}"> <div class="media-info">${m.name}<br>${m.duration.toFixed(1)}s</div>`;
        el.ondragstart = (ev) => ev.dataTransfer.setData('mediaId', m.id);
        list.appendChild(el);
      });
    }

    document.querySelectorAll('.track').forEach(track => {
      track.ondragover = e => e.preventDefault();
      track.ondrop = e => {
        e.preventDefault();
        const mediaId = e.dataTransfer.getData('mediaId');
        const m = media.find(x => x.id == mediaId);
        if (!m) return;
        const trackKey = track.dataset.track;
        const trackType = track.dataset.type;
        if (trackType === 'video' && m.type === 'audio') return;
        if (trackType === 'audio' && m.type !== 'audio' && m.type !== 'video') return;

        const rect = track.getBoundingClientRect();
        const start = Math.max(0, (e.clientX - rect.left) / pixelsPerSecond);
        const clip = {
          id: Date.now() + Math.random(),
          mediaId: m.id,
          startTime: start,
          duration: m.duration,
          trimStart: 0,
          trimEnd: m.duration,
          trackKey
        };
        getTrackArray(trackKey).push(clip);
        updateDuration();
        renderTimeline();
      };
    });

    function updateDuration() {
      let max = 10;
      [...videoTracks, ...audioTracks].forEach(t => t.forEach(c => max = Math.max(max, c.startTime + c.duration)));
      duration = max;
      document.getElementById('scrubber').max = duration;
    }

    function renderTimeline() {
      document.querySelectorAll('.track').forEach(track => {
        const trackKey = track.dataset.track;
        const clips = getTrackArray(trackKey);
        track.innerHTML = `<span class="track-label">${trackKey.toUpperCase()}</span>`;
        clips.forEach(clip => {
          const m = media.find(x => x.id == clip.mediaId);
          const el = document.createElement('div');
          el.className = 'clip' + (m && m.type === 'audio' ? ' audio-clip' : '') + (selectedClip && selectedClip.id === clip.id ? ' selected' : '');
          el.style.left = (clip.startTime * pixelsPerSecond) + 'px';
          el.style.width = Math.max(20, clip.duration * pixelsPerSecond) + 'px';
          if (m && m.thumb) {
            el.style.backgroundImage = `url(${m.thumb})`;
          }
          const durText = clip.duration.toFixed(1) + 's';
          el.innerHTML = `<div class="clip-info">${m ? m.name.substring(0, 18) : 'clip'} · ${durText}</div>`;
          el.dataset.clipId = clip.id;

          el.onclick = (e) => {
            e.stopPropagation();
            selectedClip = clip;
            renderTimeline();
          };

          if (activeTool === 'select') {
            el.onmousedown = (e) => { e.stopPropagation(); startDrag(e, clip); };
          } else if (activeTool === 'trim') {
            el.onmousedown = (e) => { e.stopPropagation(); startTrim(e, clip); };
          } else if (activeTool === 'split') {
            el.onclick = (e) => { e.stopPropagation(); splitClip(e, clip); };
          }
          track.appendChild(el);
        });
      });
      updatePlayhead();
    }

    function startDrag(e, clip) {
      if (activeTool !== 'select') return;
      e.preventDefault();
      selectedClip = clip;
      const startX = e.clientX;
      const origStart = clip.startTime;
      const origTrack = clip.trackKey;

      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / pixelsPerSecond;
        clip.startTime = Math.max(0, origStart + dx);

        const tracks = document.querySelectorAll('.track');
        for (let tr of tracks) {
          const r = tr.getBoundingClientRect();
          if (ev.clientY >= r.top && ev.clientY <= r.bottom) {
            const newKey = tr.dataset.track;
            if (newKey !== clip.trackKey) {
              const oldArr = getTrackArray(clip.trackKey);
              const i = oldArr.findIndex(c => c.id === clip.id);
              if (i >= 0) oldArr.splice(i, 1);
              clip.trackKey = newKey;
              getTrackArray(newKey).push(clip);
            }
            break;
          }
        }
        renderTimeline();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        updateDuration();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    function startTrim(e, clip) {
      if (activeTool !== 'trim') return;
      e.preventDefault();
      const rect = e.target.closest('.clip').getBoundingClientRect();
      const isLeft = e.clientX - rect.left < rect.width / 2;
      const startX = e.clientX;
      const orig = { start: clip.startTime, dur: clip.duration, trimS: clip.trimStart };
      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / pixelsPerSecond;
        if (isLeft) {
          const newStart = Math.max(0, orig.start + dx);
          const delta = newStart - orig.start;
          if (orig.dur - delta > 0.1) {
            clip.startTime = newStart;
            clip.duration = orig.dur - delta;
            clip.trimStart = orig.trimS + delta;
          }
        } else {
          clip.duration = Math.max(0.1, orig.dur + dx);
        }
        renderTimeline();
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        updateDuration();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    function splitClip(e, clip) {
      if (activeTool !== 'split') return;
      const rect = e.target.closest('.clip').getBoundingClientRect();
      const clickTime = clip.startTime + (e.clientX - rect.left) / pixelsPerSecond;
      if (clickTime <= clip.startTime + 0.1 || clickTime >= clip.startTime + clip.duration - 0.1) return;
      const offset = clickTime - clip.startTime;
      const newClip = {
        ...clip,
        id: Date.now() + Math.random(),
        startTime: clickTime,
        duration: clip.duration - offset,
        trimStart: clip.trimStart + offset
      };
      clip.duration = offset;
      getTrackArray(clip.trackKey).push(newClip);
      renderTimeline();
      updateDuration();
    }

    function formatTime(t) {
      const m = Math.floor(t / 60);
      const s = (t % 60).toFixed(2);
      return `${String(m).padStart(2,'0')}:${s.padStart(5,'0')}`;
    }

    function updatePlayhead() {
      const x = currentTime * pixelsPerSecond;
      playheadEl.style.left = x + 'px';
      document.getElementById('timeDisplay').textContent = formatTime(currentTime);
      document.getElementById('scrubber').value = currentTime;
    }

    document.getElementById('scrubber').oninput = (e) => {
      currentTime = parseFloat(e.target.value);
      updatePlayhead();
      syncMedia();
      renderFrame();
    };

    document.getElementById('playBtn').onclick = () => {
      if (isPlaying) return;
      isPlaying = true;
      lastTimestamp = performance.now();
      syncMedia(true);
      playLoop();
    };
    document.getElementById('stopBtn').onclick = () => {
      isPlaying = false;
      if (animationId) cancelAnimationFrame(animationId);
      currentTime = 0;
      pauseAllMedia();
      updatePlayhead();
      renderFrame();
    };

    function pauseAllMedia() {
      media.forEach(m => {
        if (m.element && m.element.pause) m.element.pause();
      });
    }

    function syncMedia(forcePlay = false) {
      const active = new Set();
      [...videoTracks, ...audioTracks].forEach(tr => {
        tr.forEach(clip => {
          if (currentTime >= clip.startTime && currentTime < clip.startTime + clip.duration) {
            active.add(clip.mediaId);
            const m = media.find(x => x.id == clip.mediaId);
            if (!m || !m.element) return;
            const local = clip.trimStart + (currentTime - clip.startTime);
            const el = m.element;
            if (Math.abs((el.currentTime || 0) - local) > 0.15) {
              el.currentTime = Math.max(0, Math.min(local, m.duration - 0.05));
            }
            if (forcePlay || isPlaying) {
              if (el.paused) el.play().catch(() => {});
            }
          }
        });
      });
      media.forEach(m => {
        if (m.element && m.element.pause && !active.has(m.id)) {
          m.element.pause();
        }
      });
    }

    function playLoop(ts) {
      if (!isPlaying) return;
      const delta = (ts - lastTimestamp) / 1000;
      lastTimestamp = ts;
      currentTime += delta;
      if (currentTime > duration) {
        currentTime = duration;
        isPlaying = false;
        pauseAllMedia();
      }
      updatePlayhead();
      syncMedia();
      renderFrame();
      animationId = requestAnimationFrame(playLoop);
    }

    function renderFrame() {
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      for (let t = 0; t < 3; t++) {
        for (let clip of videoTracks[t]) {
          if (currentTime >= clip.startTime && currentTime < clip.startTime + clip.duration) {
            const m = media.find(x => x.id == clip.mediaId);
            if (!m) continue;
            if (m.type === 'video' && m.element) {
              ctx.drawImage(m.element, 0, 0, w, h);
            } else if (m.type === 'image' && m.element) {
              ctx.drawImage(m.element, 0, 0, w, h);
            }
          }
        }
      }
    }

    function getCanvasSize(aspect, res) {
      const ratios = { '16:9': 16/9, '9:16': 9/16, '1:1': 1, '4:3': 4/3 };
      const r = ratios[aspect] || 16/9;
      let height = parseInt(res);
      let width = Math.round(height * r);
      if (aspect === '9:16') {
        width = parseInt(res);
        height = Math.round(width / r);
      }
      return { width: width - (width % 2), height: height - (height % 2) };
    }

    document.getElementById('exportBtn').onclick = () => {
      document.getElementById('exportModal').style.display = 'flex';
    };
    document.getElementById('closeModal').onclick = () => {
      document.getElementById('exportModal').style.display = 'none';
    };

    document.getElementById('startExport').onclick = async () => {
      const aspect = document.getElementById('aspectSelect').value;
      const res = document.getElementById('resSelect').value;
      const fps = parseInt(document.getElementById('fpsSelect').value);
      const format = document.getElementById('formatSelect').value;
      const { width, height } = getCanvasSize(aspect, res);

      document.getElementById('exportStatus').textContent = 'מכין ייצוא...';
      canvas.width = width;
      canvas.height = height;

      let mime = 'video/webm;codecs=vp9';
      if (format === 'webm-vp8') mime = 'video/webm;codecs=vp8';
      if (format === 'webm-av1') mime = 'video/webm;codecs=av1';

      if (!MediaRecorder.isTypeSupported(mime)) {
        mime = 'video/webm';
      }

      const stream = canvas.captureStream(fps);

      if (!audioContext) audioContext = new AudioContext();
      const dest = audioContext.createMediaStreamDestination();
      const audioTracksToMix = [];

      media.forEach(m => {
        if ((m.type === 'video' || m.type === 'audio') && m.element) {
          try {
            const src = audioContext.createMediaElementSource(m.element);
            src.connect(dest);
            src.connect(audioContext.destination);
            audioTracksToMix.push(src);
          } catch (err) {}
        }
      });

      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));

      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime.split(';')[0] });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `DaniWorldsStudio_${aspect.replace(':','x')}_${res}p.webm`;
        a.click();
        document.getElementById('exportStatus').textContent = 'הורדה הושלמה!';
        canvas.width = 1280; canvas.height = 720;
        pauseAllMedia();
      };

      currentTime = 0;
      isPlaying = true;
      lastTimestamp = performance.now();
      recorder.start();
      syncMedia(true);
      playLoop(performance.now());

      const check = setInterval(() => {
        if (currentTime >= duration || !isPlaying) {
          clearInterval(check);
          setTimeout(() => {
            isPlaying = false;
            recorder.stop();
          }, 200);
        }
      }, 100);

      document.getElementById('exportStatus').textContent = 'מרנדר...';
    };

    updateDuration();
    renderTimeline();
    renderFrame();
  </script>
</body>
</html>
